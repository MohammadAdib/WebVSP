# Builds the WebVSP web UI (web/frontend) and deploys it to GitHub Pages.
# The hosted UI connects to the WebVSP engine running on the user's machine
# (web/vsp-web.cmd, http://localhost:8765). The engine only accepts requests from
# trusted UI origins; see WEB_ORIGINS in web/backend/vspweb/app.py.
name: Deploy web UI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: web/frontend

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install
        working-directory: web/frontend
        run: npm ci

      - name: Build
        working-directory: web/frontend
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
