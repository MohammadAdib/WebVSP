# Builds WebVSP (web/frontend) and deploys it to GitHub Pages.
# OpenVSP compiled to WebAssembly (web/wasm) is built locally with web/wasm/build_wasm.ps1
# and published as the wasm-latest release; it's added to the site here.
name: Deploy web UI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: web/frontend

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install
        working-directory: web/frontend
        run: npm ci

      - name: In-browser engine module
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p web/frontend/public/wasm
          gh release download wasm-latest -R ${{ github.repository }} -p 'vsp*.js' -p 'vsp*.wasm' -D web/frontend/public/wasm --clobber             || echo "::warning::No wasm-latest release: the site has no in-browser engine"

      - name: Build
        working-directory: web/frontend
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
